<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>政策罗盘 PolicyCompass · Agentic RAG</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --border: #2a3550;
    --text: #dbe4f5; --dim: #8a97b5; --accent: #5b8cff; --green: #3ecf8e;
    --amber: #f5b942; --red: #ff7a7a; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         display: flex; height: 100vh; overflow: hidden; }
  aside { width: 320px; background: var(--panel); border-right: 1px solid var(--border);
          padding: 18px; overflow-y: auto; flex-shrink: 0; }
  main { flex: 1; display: flex; flex-direction: column; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 12px; background: var(--panel); }
  header h1 { font-size: 17px; font-weight: 600; }
  header .sub { color: var(--dim); font-size: 12px; }
  .badge { background: var(--panel2); border: 1px solid var(--border); color: var(--dim);
           font-size: 11px; padding: 2px 8px; border-radius: 99px; margin-left: auto; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; }
  .msg { max-width: 780px; margin: 0 auto 18px; display: flex; gap: 10px; }
  .msg .who { font-size: 11px; color: var(--dim); width: 44px; flex-shrink: 0; padding-top: 8px; }
  .bubble { background: var(--panel); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 12px 16px; line-height: 1.75;
            white-space: pre-wrap; font-size: 14px; flex: 1; }
  .msg.user .bubble { background: #22304e; border-color: #33456e; }
  .cursor { display: inline-block; width: 8px; height: 16px; background: var(--accent);
            vertical-align: -2px; animation: blink 0.8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sources { margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .src { font-size: 12px; color: var(--dim); background: var(--panel2);
         border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  .src.invalid { border-color: #6b4a4a; color: var(--red); }
  .src .ok { color: var(--green); }
  #inputbar { padding: 16px 24px; border-top: 1px solid var(--border); background: var(--panel); }
  form { max-width: 780px; margin: 0 auto; display: flex; gap: 10px; }
  input { flex: 1; background: var(--panel2); border: 1px solid var(--border);
          color: var(--text); border-radius: 10px; padding: 12px 16px; font-size: 14px; outline: none; }
  input:focus { border-color: var(--accent); }
  button { background: var(--accent); color: white; border: none; border-radius: 10px;
           padding: 0 22px; font-size: 14px; cursor: pointer; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  aside h3 { font-size: 12px; color: var(--dim); text-transform: uppercase;
             letter-spacing: 1px; margin-bottom: 12px; }
  .event { font-size: 12px; background: var(--panel2); border: 1px solid var(--border);
           border-radius: 8px; padding: 8px 10px; margin-bottom: 8px;
           animation: slidein 0.25s ease; line-height: 1.5; }
  @keyframes slidein { from { transform: translateX(-8px); opacity: 0; } }
  .event b { color: var(--accent); font-weight: 600; }
  .event .detail { color: var(--dim); }
  .event.warn b { color: var(--amber); }
  .event.bad b { color: var(--red); }
  .suggestion { display: inline-block; background: var(--panel2); border: 1px solid var(--border);
                border-radius: 99px; padding: 6px 12px; font-size: 12px; color: var(--dim);
                cursor: pointer; margin: 0 6px 8px 0; }
  .suggestion:hover { color: var(--text); border-color: var(--accent); }
  #stats { margin-top: 16px; font-size: 11px; color: var(--dim); line-height: 1.8; }
  .hint { max-width: 780px; margin: 0 auto 14px; }
</style>
</head>
<body>
<aside>
  <h3>Agent 决策路径（实时 Trace）</h3>
  <div id="events"></div>
  <div id="stats">等待提问…<br>模式：<span id="mode">-</span></div>
</aside>
<main>
  <header>
    <h1>🧭 政策罗盘 PolicyCompass</h1>
    <span class="sub">跨城市社保/公积金政策 · Agentic RAG（CRAG 自纠错 + Function Calling + 忠实度校验）</span>
    <span class="badge" id="modeBadge">-</span>
  </header>
  <div id="chat">
    <div class="hint">
      <span class="suggestion">我杭州公积金余额4万缴了5年月薪2万，最多能贷多少？</span>
      <span class="suggestion">我跳槽去上海了，杭州的公积金能带走吗</span>
      <span class="suggestion">北京和上海租房提取额度分别是多少</span>
      <span class="suggestion">上海拍车牌需要什么条件</span>
    </div>
  </div>
  <div id="inputbar">
    <form onsubmit="return send(event)">
      <input id="q" placeholder="输入社保/公积金问题，回车发送…" autocomplete="off">
      <button id="btn" type="submit">发送</button>
    </form>
  </div>
</main>
<script>
const chatEl = document.getElementById('chat');
const eventsEl = document.getElementById('events');
const qEl = document.getElementById('q');
const btnEl = document.getElementById('btn');

document.querySelectorAll('.suggestion').forEach(s =>
  s.addEventListener('click', () => { qEl.value = s.textContent; send(); }));

// 回车直接发送（不依赖表单默认提交，兼容所有浏览器内核）
qEl.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); send(); }
});

function addUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="who">你</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addAssistant() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="who">罗盘</div><div class="bubble"><span class="text"></span><span class="cursor"></span></div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

const EV_LABEL = {
  route: e => [`路由`, `识别 ${e.city}/${e.domain}，需计算=${e.need_calc}`],
  retrieve: e => [`检索·第${e.round}轮`, `top1《${(e.top1||'').slice(0,16)}》${e.hits}条 ${e.latency_ms}ms`],
  grade: e => [`评分`, `最高分 ${e.max_grade}，均分 ${e.avg_grade}`],
  rewrite: e => [`黑话改写`, `${(e.new_query||'').slice(0,26)}`],
  tool: e => [`工具调用`, `${e.tool}(${JSON.stringify(e.args)}) → ${e.ok ? '成功' : '失败'}`],
  generate: e => [`生成·第${e.attempt}次`, `${e.chars} 字 ${e.latency_ms}ms`],
  verify: e => e.grounded ? [`忠实度校验`, '通过 ✓'] : [`忠实度校验`, '存在无出处表述 ✗'],
  fallback: () => [`诚实拒答`, '知识库未收录，不编造'],
};

function addEvent(ev) {
  const div = document.createElement('div');
  div.className = 'event' + (ev.event === 'rewrite' ? ' warn' : '') +
                  (ev.event === 'fallback' ? ' bad' : '');
  let label, detail;
  const f = EV_LABEL[ev.event];
  if (f) { [label, detail] = f(ev); }
  else { label = ev.event; detail = ''; }
  div.innerHTML = `<b>${label}</b><div class="detail">${detail}</div>`;
  eventsEl.appendChild(div);
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

async function send(e) {
  if (e) e.preventDefault();
  const text = qEl.value.trim();
  if (!text || btnEl.disabled) return false;
  qEl.value = ''; btnEl.disabled = true;
  eventsEl.innerHTML = '';
  addUser(text);
  const ai = addAssistant();
  const textEl = ai.querySelector('.text');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: text, stream: true }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', answer = '', sources = [], done = null;

    while (true) {
      const { value, done: rd } = await reader.read();
      if (rd) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data: ')) continue;
        const obj = JSON.parse(line.slice(6));
        if (obj.type === 'meta') {
          // 第二次提问时 #mode 可能已被统计更新重建，需判空
          const modeEl = document.getElementById('mode');
          const badge = document.getElementById('modeBadge');
          if (modeEl) modeEl.textContent = obj.llm_mode;
          if (badge) badge.textContent = 'LLM: ' + obj.llm_mode;
        } else if (obj.type === 'trace') {
          addEvent(obj.event);
        } else if (obj.type === 'token') {
          answer += obj.text;
          textEl.textContent = answer;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (obj.type === 'correction') {
          answer = obj.answer;
          textEl.textContent = answer;
        } else if (obj.type === 'error') {
          answer = '服务内部错误：' + (obj.detail || '未知');
          textEl.textContent = answer;
        } else if (obj.type === 'done') {
          done = obj;
        }
      }
    }
    ai.querySelector('.cursor').remove();
    if (done) {
      if (done.sources && done.sources.length) {
        const box = document.createElement('div');
        box.className = 'sources';
        box.innerHTML = done.sources.map(s =>
          `<div class="src ${s.is_valid ? '' : 'invalid'}">[${s.no}] 《${s.title}》 ${s.doc_no} · 生效 ${s.effective_date} · ${s.is_valid ? '<span class="ok">现行有效</span>' : '已废止'}</div>`
        ).join('');
        ai.querySelector('.bubble').appendChild(box);
      }
      const meta = document.createElement('div');
      meta.className = 'src';
      meta.style.marginTop = '6px';
      meta.textContent = `耗时 ${done.latency_ms}ms${done.tool_result ? ' · 调用工具 ' + done.tool_result.tool : ''}${done.refusal ? ' · 拒答（知识库未收录）' : ''}`;
      ai.querySelector('.bubble').appendChild(meta);
      const stats = await (await fetch('/api/stats')).json();
      // 只更新统计行，不整体替换 #stats（其中含 id=mode 的模式标签）
      let statsLine = document.getElementById('statsLine');
      if (!statsLine) {
        statsLine = document.createElement('div');
        statsLine.id = 'statsLine';
        document.getElementById('stats').insertBefore(statsLine, document.getElementById('stats').firstChild);
      }
      statsLine.innerHTML =
        `累计请求 ${stats.queries_total} · 工具调用 ${stats.tool_calls} · 拒答 ${stats.refusals}<br>` +
        `JSON 修复率 ${stats.json_first_pass_failure_rate ?? 0} · rerank 降级 ${stats.rerank_fallbacks}`;
    }
  } catch (err) {
    ai.querySelector('.cursor').remove();
    // 自动探测失败原因，给出可操作的提示
    let hint;
    if (location.protocol === 'file:') {
      hint = '你是直接双击打开的本文件（file:// 协议），无法访问后端。请改为：启动服务后浏览器访问 http://127.0.0.1:8000';
    } else {
      try {
        const h = await fetch('/api/health', { signal: AbortSignal.timeout(3000) });
        hint = h.ok ? '连接中断：' + err.message : '后端服务未响应（可能已停止）。请重新运行 python scripts/serve.py 后刷新本页';
      } catch {
        hint = '后端服务未启动或不可达。请在项目目录运行 python scripts/serve.py，然后刷新本页；若从其他设备访问，请用这台电脑的局域网 IP（ipconfig 查看）替换 127.0.0.1';
      }
    }
    textEl.textContent = '❌ ' + hint;
  }
  btnEl.disabled = false;
  qEl.focus();
  return false;
}
</script>
</body>
</html>
