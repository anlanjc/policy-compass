<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>政策罗盘 PolicyCompass · Agentic RAG</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%23b91c1c'/%3E%3Ctext x='16' y='22' font-size='16' font-family='serif' fill='%23fffdf8' text-anchor='middle'%3E罗%3C/text%3E%3C/svg%3E">
<style>
  /* ── 政务文书·纸面浅色（PC-3 视觉改版）────────────────────────
     设计语言：红头文件语境——纸面底、藏蓝正文、朱红文号/印章、衬线标题。
     与 askbi 的暗色数据大屏形成两个真实产品的差异化。 */
  :root {
    --paper: #f6f3ea;       /* 纸面底 */
    --paper2: #fffdf7;      /* 卡片面 */
    --paper3: #efeadb;      /* 侧栏/输入区 */
    --line: #e3dcc8;        /* 纸面分隔线 */
    --line2: #d4cbb2;
    --ink: #2a2e37;         /* 正文墨 */
    --ink-dim: #8a8574;     /* 暖灰说明 */
    --navy: #1e3a5f;        /* 藏蓝主色 */
    --navy-deep: #16293f;
    --navy-soft: #edf2f8;   /* 藏蓝浅底（用户消息） */
    --seal: #b91c1c;        /* 朱红：文号/印章/警示 */
    --seal-soft: #fbf1ef;
    --green: #1a7a3d;       /* 现行有效 */
    --green-soft: #edf6ef;
    --amber: #9a6a12;       /* 改写警示 */
    --radius: 10px;
    --shadow: 0 1px 2px rgba(87, 74, 40, .07), 0 4px 14px rgba(87, 74, 40, .06);
    --serif: "Noto Serif SC", "Source Han Serif SC", "STZhongsong", "SimSun", serif;
    --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: "Cascadia Mono", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--navy); color: #fffdf8; }
  html { height: 100%; }
  body {
    background: var(--paper); color: var(--ink); font-family: var(--sans);
    display: flex; height: 100vh; overflow: hidden; font-size: 14px;
  }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: #c2b796; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* 顶部朱红细线：红头文件标识 */
  body::before { content: ""; position: fixed; top: 0; left: 0; right: 0; height: 4px;
                 background: linear-gradient(90deg, var(--seal) 0 70%, #d34d4d 70% 100%); z-index: 10; }

  /* ── 侧栏：决策路径卷宗 ── */
  aside {
    width: 320px; background: var(--paper3); border-right: 1px solid var(--line);
    padding: 20px 18px 16px; overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column;
  }
  aside h3 {
    font-family: var(--serif); font-size: 14px; color: var(--navy); font-weight: 700;
    letter-spacing: 2px; padding-bottom: 10px; margin-bottom: 14px;
    border-bottom: 1px solid var(--line2); display: flex; align-items: center; gap: 8px;
  }
  aside h3::before { content: ""; width: 8px; height: 8px; background: var(--seal);
                     border-radius: 2px; transform: rotate(45deg); }
  /* 时间线：左侧卷宗轴 + 节点 */
  #events { position: relative; padding-left: 14px; flex: 0 0 auto; }
  #events::before { content: ""; position: absolute; left: 3px; top: 6px; bottom: 6px;
                    width: 1px; background: var(--line2); }
  .event { position: relative; background: var(--paper2); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 8px 11px; margin-bottom: 9px;
           box-shadow: var(--shadow); animation: slidein .25s ease; line-height: 1.55; }
  @keyframes slidein { from { transform: translateX(-8px); opacity: 0; } }
  .event::before { content: ""; position: absolute; left: -15px; top: 13px; width: 7px; height: 7px;
                   border-radius: 50%; background: var(--paper2); border: 2px solid var(--navy); }
  .event b { color: var(--navy); font-weight: 700; font-size: 12.5px;
             font-family: var(--serif); letter-spacing: .5px; }
  .event .detail { color: var(--ink-dim); font-size: 12px; margin-top: 3px; word-break: break-all; }
  .event .detail code, .event .detail .mono { font-family: var(--mono); font-size: 11px; }
  .event.warn::before { border-color: var(--amber); }
  .event.warn b { color: var(--amber); }
  .event.bad { background: var(--seal-soft); }
  .event.bad::before { border-color: var(--seal); background: var(--seal); }
  .event.bad b { color: var(--seal); }
  .event.good::before { border-color: var(--green); }
  .event.good b { color: var(--green); }
  #stats { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--line2);
           font-size: 11.5px; color: var(--ink-dim); line-height: 1.9; }
  #stats b { color: var(--navy); font-weight: 600; }

  /* ── 主区 ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header {
    padding: 16px 26px 14px; border-bottom: 1px solid var(--line); background: var(--paper2);
    display: flex; align-items: center; gap: 14px;
  }
  .seal-mark {
    width: 40px; height: 40px; flex-shrink: 0; border: 2px solid var(--seal); border-radius: 8px;
    color: var(--seal); font-family: var(--serif); font-weight: 700; font-size: 22px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: inset 0 0 0 1px rgba(185, 28, 28, .25);
    transform: rotate(-3deg); background: var(--paper2);
  }
  header h1 { font-family: var(--serif); font-size: 19px; font-weight: 700; color: var(--navy);
              letter-spacing: 1px; }
  header h1 .latin { font-family: var(--sans); font-size: 12px; font-weight: 400;
                     color: var(--ink-dim); letter-spacing: .3px; margin-left: 6px; }
  header .sub { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }
  .badge {
    margin-left: auto; background: var(--paper2); border: 1.5px solid var(--seal); color: var(--seal);
    font-size: 11.5px; padding: 3px 10px; border-radius: 4px; font-family: var(--serif);
    font-weight: 700; letter-spacing: 1px; transform: rotate(2deg); white-space: nowrap;
  }

  /* ── 会话区 ── */
  #chat { flex: 1; overflow-y: auto; padding: 26px 26px 18px; }
  .msg { max-width: 800px; margin: 0 auto 20px; display: flex; gap: 12px; }
  .msg .who {
    width: 34px; height: 34px; flex-shrink: 0; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-weight: 700; font-size: 15px;
    border-radius: 8px;
  }
  .msg.user .who { background: var(--navy); color: #fffdf8; border-radius: 50%; }
  .msg.ai .who { background: var(--paper2); color: var(--seal); border: 2px solid var(--seal);
                 transform: rotate(-3deg); box-shadow: var(--shadow); }
  .bubble {
    background: var(--paper2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 13px 17px; line-height: 1.95; white-space: pre-wrap; font-size: 14.5px;
    flex: 1; box-shadow: var(--shadow); animation: rise .22s ease;
  }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } }
  .msg.ai .bubble { font-family: var(--serif); color: #21252e; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .bubble {
    background: var(--navy-soft); border-color: #ccd9ea; color: var(--navy-deep);
    font-family: var(--sans); font-size: 14px;
  }
  .msg.ai .bubble.refusal { background: var(--seal-soft); border-color: #e7c7c4; }
  .cursor { display: inline-block; width: 7px; height: 15px; background: var(--seal);
            vertical-align: -2px; margin-left: 2px; animation: blink .8s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* 引用卡：文号徽章 */
  .sources { margin-top: 12px; display: flex; flex-direction: column; gap: 7px; }
  .src {
    font-size: 12px; color: var(--ink-dim); background: #fffefa;
    border: 1px solid var(--line); border-left: 3px solid var(--seal); border-radius: 6px;
    padding: 7px 11px; line-height: 1.7; box-shadow: var(--shadow);
  }
  .src .doc-no { color: var(--seal); font-weight: 700; font-family: var(--serif); }
  .src .st { display: inline-block; font-size: 11px; padding: 0 7px; border-radius: 3px;
             border: 1px solid; line-height: 1.6; }
  .src .st.ok { color: var(--green); border-color: #bcd9c5; background: var(--green-soft); }
  .src.invalid { border-left-color: var(--ink-dim); }
  .src.invalid .st { color: var(--seal); border-color: #e0b9b6; background: var(--seal-soft); }
  .meta { display: inline-block; margin-top: 9px; font-size: 11.5px; color: var(--ink-dim);
          background: var(--paper3); border: 1px dashed var(--line2); border-radius: 99px;
          padding: 3px 11px; }

  /* ── 空态 ── */
  .hint { max-width: 640px; margin: 6vh auto 0; text-align: center; }
  .empty-seal {
    width: 64px; height: 64px; margin: 0 auto 16px; border: 2.5px solid var(--seal); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-family: var(--serif);
    font-size: 36px; font-weight: 700; color: var(--seal); transform: rotate(-4deg);
    box-shadow: var(--shadow), inset 0 0 0 1px rgba(185, 28, 28, .2); background: var(--paper2);
  }
  .empty-title { font-family: var(--serif); font-size: 22px; font-weight: 700; color: var(--navy);
                 letter-spacing: 3px; }
  .empty-sub { color: var(--ink-dim); font-size: 13px; margin: 8px 0 26px; line-height: 1.8; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
  .suggestion {
    display: block; background: var(--paper2); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; font-size: 13px; color: var(--ink); cursor: pointer;
    box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
  }
  .suggestion::before {
    content: attr(data-k); display: inline-block; font-size: 11px; color: var(--seal);
    border: 1px solid #e0b9b6; background: var(--seal-soft); border-radius: 3px;
    padding: 0 6px; margin-right: 8px; font-family: var(--serif);
  }
  .suggestion:hover { border-color: var(--navy); transform: translateY(-1px); }

  /* ── 输入区 ── */
  #inputbar { padding: 15px 26px 18px; border-top: 1px solid var(--line); background: var(--paper3); }
  form { max-width: 800px; margin: 0 auto; display: flex; gap: 10px; }
  input {
    flex: 1; background: var(--paper2); border: 1px solid var(--line2); color: var(--ink);
    border-radius: var(--radius); padding: 12px 16px; font-size: 14px; outline: none;
    font-family: var(--sans); box-shadow: inset 0 1px 2px rgba(87, 74, 40, .05);
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #b3ac97; }
  input:focus { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(30, 58, 95, .12); }
  button {
    background: var(--navy); color: #fffdf8; border: none; border-radius: var(--radius);
    padding: 0 26px; font-size: 14px; cursor: pointer; font-family: var(--serif);
    letter-spacing: 2px; transition: background .15s;
  }
  button:hover { background: var(--navy-deep); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  @media (max-width: 880px) {
    aside { display: none; }
    .cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<aside>
  <h3>决策路径 · 实时 TRACE</h3>
  <div id="events"></div>
  <div id="stats">等待提问…<br>模式：<span id="mode">-</span></div>
</aside>
<main>
  <header>
    <div class="seal-mark">罗</div>
    <div>
      <h1>政策罗盘<span class="latin">PolicyCompass</span></h1>
      <div class="sub">跨城市社保/公积金政策问答 · 每个数字可溯源到文号与条款</div>
    </div>
    <span class="badge" id="modeBadge">-</span>
  </header>
  <div id="chat">
    <div class="hint">
      <div class="empty-seal">罗</div>
      <div class="empty-title">政策罗盘</div>
      <div class="empty-sub">社保公积金政策问答，答不了的宁可拒答也不编造<br>引用均带文号、生效日期与现行/废止标注</div>
      <div class="cards">
        <span class="suggestion" data-k="额度计算">我杭州公积金余额4万缴了5年月薪2万，最多能贷多少？</span>
        <span class="suggestion" data-k="跨城转移">我跳槽去上海了，杭州的公积金能带走吗</span>
        <span class="suggestion" data-k="跨城对比">北京和上海租房提取额度分别是多少</span>
        <span class="suggestion" data-k="界外拒答">上海拍车牌需要什么条件</span>
      </div>
    </div>
  </div>
  <div id="inputbar">
    <form onsubmit="return send(event)">
      <input id="q" placeholder="输入社保/公积金问题，回车发送…" autocomplete="off">
      <button id="btn" type="submit">发 送</button>
    </form>
  </div>
</main>
<script>
const chatEl = document.getElementById('chat');
const eventsEl = document.getElementById('events');
const qEl = document.getElementById('q');
const btnEl = document.getElementById('btn');

document.querySelectorAll('.suggestion').forEach(s =>
  s.addEventListener('click', () => { qEl.value = s.textContent; send(); }));

// 回车直接发送（不依赖表单默认提交，兼容所有浏览器内核）
qEl.addEventListener('keydown', ev => {
  if (ev.key === 'Enter') { ev.preventDefault(); send(); }
});

function addUser(text) {
  const div = document.createElement('div');
  div.className = 'msg user';
  div.innerHTML = `<div class="who">问</div><div class="bubble"></div>`;
  div.querySelector('.bubble').textContent = text;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

function addAssistant() {
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.innerHTML = `<div class="who">罗</div><div class="bubble"><span class="text"></span><span class="cursor"></span></div>`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return div;
}

const EV_LABEL = {
  route: e => [`路由`, `识别 ${e.city}/${e.domain}，需计算=${e.need_calc}`],
  retrieve: e => [`检索·第${e.round}轮`, `top1《${(e.top1||'').slice(0,16)}》${e.hits}条 ${e.latency_ms}ms`],
  grade: e => [`评分`, `最高分 ${e.max_grade}，均分 ${e.avg_grade}`],
  rewrite: e => [`黑话改写`, `${(e.new_query||'').slice(0,26)}`],
  tool: e => [`工具调用`, `${e.tool}(${JSON.stringify(e.args)}) → ${e.ok ? '成功' : '失败'}`],
  generate: e => [`生成·第${e.attempt}次`, `${e.chars} 字 ${e.latency_ms}ms`],
  verify: e => e.grounded ? [`忠实度校验`, '通过 ✓'] : [`忠实度校验`, '存在无出处表述 ✗'],
  fallback: () => [`诚实拒答`, '知识库未收录，不编造'],
};

function addEvent(ev) {
  const div = document.createElement('div');
  div.className = 'event' + (ev.event === 'rewrite' ? ' warn' : '') +
                  (ev.event === 'fallback' ? ' bad' : '') +
                  (ev.event === 'verify' && ev.grounded ? ' good' : '') +
                  (ev.event === 'tool' && ev.ok ? ' good' : '');
  let label, detail;
  const f = EV_LABEL[ev.event];
  if (f) { [label, detail] = f(ev); }
  else { label = ev.event; detail = ''; }
  // textContent 组装（S3 评审 PC-6）：trace 事件内嵌 query/new_query 用户原文，
  // innerHTML 拼接会被注入的标题/问题文本执行
  const b = document.createElement('b');
  b.textContent = label;
  const d = document.createElement('div');
  d.className = 'detail';
  d.textContent = detail;
  div.appendChild(b);
  div.appendChild(d);
  eventsEl.appendChild(div);
  eventsEl.scrollTop = eventsEl.scrollHeight;
}

async function send(e) {
  if (e) e.preventDefault();
  const text = qEl.value.trim();
  if (!text || btnEl.disabled) return false;
  qEl.value = ''; btnEl.disabled = true;
  eventsEl.innerHTML = '';
  const hintEl = document.querySelector('.hint');
  if (hintEl) hintEl.style.display = 'none';  // 首问后隐藏空态
  addUser(text);
  const ai = addAssistant();
  const textEl = ai.querySelector('.text');

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ question: text, stream: true }),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '', answer = '', sources = [], done = null;

    while (true) {
      const { value, done: rd } = await reader.read();
      if (rd) break;
      buf += decoder.decode(value, { stream: true });
      const frames = buf.split('\n\n');
      buf = frames.pop();
      for (const frame of frames) {
        const line = frame.trim();
        if (!line.startsWith('data: ')) continue;
        const obj = JSON.parse(line.slice(6));
        if (obj.type === 'meta') {
          // 第二次提问时 #mode 可能已被统计更新重建，需判空
          const modeEl = document.getElementById('mode');
          const badge = document.getElementById('modeBadge');
          if (modeEl) modeEl.textContent = obj.llm_mode;
          if (badge) badge.textContent = 'LLM: ' + obj.llm_mode;
        } else if (obj.type === 'trace') {
          addEvent(obj.event);
        } else if (obj.type === 'token') {
          answer += obj.text;
          textEl.textContent = answer;
          chatEl.scrollTop = chatEl.scrollHeight;
        } else if (obj.type === 'correction') {
          answer = obj.answer;
          textEl.textContent = answer;
        } else if (obj.type === 'error') {
          answer = '服务内部错误：' + (obj.detail || '未知');
          textEl.textContent = answer;
        } else if (obj.type === 'done') {
          done = obj;
        }
      }
    }
    ai.querySelector('.cursor').remove();
    if (done) {
      if (done.refusal) ai.querySelector('.bubble').classList.add('refusal');
      if (done.sources && done.sources.length) {
        const box = document.createElement('div');
        box.className = 'sources';
        // textContent 组装（S3 评审 PC-6）：title/doc_no 来自上传内容，
        // innerHTML 拼接会执行注入的标题（存储型 XSS 主向量）
        for (const s of done.sources) {
          const card = document.createElement('div');
          card.className = 'src ' + (s.is_valid ? '' : 'invalid');
          const add = (text, cls) => {
            if (!text) return;
            const el = cls ? document.createElement('span') : document.createTextNode(text);
            if (cls) { el.className = cls; el.textContent = text; }
            card.appendChild(el);
          };
          add(`《${s.title}》`);
          card.appendChild(document.createElement('br'));
          add(s.doc_no || '（无文号记录）', 'doc-no');
          add(` · 生效 ${s.effective_date || '—'}`);
          if (s.sections && s.sections.length) add(' · ' + s.sections.join('、'));
          if (s.pages && s.pages.length) add(' · 第' + s.pages.join('、') + '页');
          add(` ${s.is_valid ? '现行有效' : '已废止'}`, 'st' + (s.is_valid ? ' ok' : ''));
          box.appendChild(card);
        }
        ai.querySelector('.bubble').appendChild(box);
      }
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `耗时 ${done.latency_ms}ms${done.tool_result ? ' · 调用工具 ' + done.tool_result.tool : ''}${done.refusal ? ' · 拒答（知识库未收录）' : ''}`;
      ai.querySelector('.bubble').appendChild(meta);
      const stats = await (await fetch('/api/stats')).json();
      // 只更新统计行，不整体替换 #stats（其中含 id=mode 的模式标签）
      let statsLine = document.getElementById('statsLine');
      if (!statsLine) {
        statsLine = document.createElement('div');
        statsLine.id = 'statsLine';
        document.getElementById('stats').insertBefore(statsLine, document.getElementById('stats').firstChild);
      }
      statsLine.innerHTML =
        `累计请求 <b>${stats.queries_total}</b> · 工具调用 <b>${stats.tool_calls}</b> · 拒答 <b>${stats.refusals}</b><br>` +
        `JSON 修复率 ${stats.json_first_pass_failure_rate ?? 0} · rerank 降级 ${stats.rerank_fallbacks}`;
    }
  } catch (err) {
    ai.querySelector('.cursor').remove();
    // 自动探测失败原因，给出可操作的提示
    let hint;
    if (location.protocol === 'file:') {
      hint = '你是直接双击打开的本文件（file:// 协议），无法访问后端。请改为：启动服务后浏览器访问 http://127.0.0.1:8000';
    } else {
      try {
        const h = await fetch('/api/health', { signal: AbortSignal.timeout(3000) });
        hint = h.ok ? '连接中断：' + err.message : '后端服务未响应（可能已停止）。请重新运行 python scripts/serve.py 后刷新本页';
      } catch {
        hint = '后端服务未启动或不可达。请在项目目录运行 python scripts/serve.py，然后刷新本页；若从其他设备访问，请用这台电脑的局域网 IP（ipconfig 查看）替换 127.0.0.1';
      }
    }
    textEl.textContent = '❌ ' + hint;
  }
  btnEl.disabled = false;
  qEl.focus();
  return false;
}
</script>
</body>
</html>
