services:
  policy-compass:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 不配置 key 时以 mock 模式启动，可直接体验全链路；
      # 接入真实模型：填入 LLM_API_KEY / EMBED_API_KEY / RERANK_API_KEY
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com/v1}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      EMBED_API_KEY: ${EMBED_API_KEY:-}
      EMBED_API_BASE: ${EMBED_API_BASE:-https://api.siliconflow.cn/v1}
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-m3}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
    volumes:
      - policy-data:/app/data
    restart: unless-stopped

volumes:
  policy-data:
